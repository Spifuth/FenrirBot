# =============================================================================
# Spec serveur Discord — Communauté post-intervention lycée STI2D SIN
# =============================================================================
# Format déclaratif consommé par la commande `apply-server-config` du bot.
# Source de vérité du serveur — diffable, versionnable.
#
# Ordre d'application requis (côté bot) :
#   1. Server settings (verification level, etc.)
#   2. Roles (du plus bas au plus haut en position)
#   3. Categories (avec overwrites)
#   4. Channels (avec overwrites)
#   5. Re-positionnement des roles si nécessaire
# =============================================================================

meta:
  spec_version: "1.0"
  description: >
    Serveur communautaire pour prolonger l'intervention lycée :
    discussions cyber/IA/dev, orientation post-bac, ressources, CTF.
  target_audience: "Lycéens STI2D SIN (~16-18 ans) ayant participé à l'intervention"
  language: fr

# -----------------------------------------------------------------------------
# Paramètres globaux du serveur
# -----------------------------------------------------------------------------
server:
  # À CHANGER : nom du serveur que tu veux afficher
  name: "STI2D-SIN — Découverte Tech"   # TODO toi

  # Niveau de vérification : limite les nouveaux comptes qui peuvent rejoindre
  # Options : NONE, LOW (email vérifié), MEDIUM (email + 5min sur Discord),
  #          HIGH (+ phone vérifié), VERY_HIGH (10 min sur le serveur)
  # Reco pour public mineur : HIGH (phone vérifié = filtre les bots/raids)
  verification_level: HIGH

  # Filtrage automatique des médias par Discord (NSFW)
  # Reco mineurs : ALL_MEMBERS
  explicit_content_filter: ALL_MEMBERS

  # Notifications par défaut : ONLY_MENTIONS (sinon overdose)
  default_notifications: ONLY_MENTIONS

  # Active les fonctionnalités Community (welcome screen, règles natives)
  # Note : nécessite que le serveur respecte certains critères Discord
  community_enabled: true

# -----------------------------------------------------------------------------
# Rôles — listés du PLUS HAUT au PLUS BAS dans la hiérarchie.
# C'est l'ordre que tu vois dans Discord : Server Settings → Roles, top-down.
# Le premier listé sera tout en haut, le dernier juste au-dessus de @everyone.
# -----------------------------------------------------------------------------
# IMPORTANT : le bot ne peut PAS positionner un rôle au-dessus de sa propre
# position. Pour que la repositionnement complet fonctionne, déplace le rôle
# du bot tout en haut de la hiérarchie AVANT la 1ère exécution.
# Sinon les rôles seront créés mais pas tous repositionnés (best-effort).
# -----------------------------------------------------------------------------

roles:

  # --- Administrateur (toi) ---
  - id: administrateur
    name: "👑 Administrateur"
    color: "#992D22"     # rouge sombre
    hoist: true
    mentionable: false
    permissions:
      - ADMINISTRATOR

  # --- Modérateurs ---
  - id: moderateur
    name: "🛡️ Modérateur"
    color: "#E67E22"     # orange foncé
    hoist: true
    mentionable: true
    permissions:
      - VIEW_CHANNEL
      - READ_MESSAGE_HISTORY
      - SEND_MESSAGES
      - MANAGE_MESSAGES        # pin, delete
      - MANAGE_THREADS
      - KICK_MEMBERS
      - MODERATE_MEMBERS       # timeout
      - MUTE_MEMBERS
      - DEAFEN_MEMBERS
      - MOVE_MEMBERS
      - VIEW_AUDIT_LOG
      - MENTION_EVERYONE
      - ATTACH_FILES
      - EMBED_LINKS
      - ADD_REACTIONS

  # --- Intervenants externes (pro qui viennent parler de leur métier) ---
  - id: intervenant
    name: "🎤 Intervenant"
    color: "#F1C40F"     # jaune doré
    hoist: true
    mentionable: true
    permissions:
      - VIEW_CHANNEL
      - READ_MESSAGE_HISTORY
      - SEND_MESSAGES
      - EMBED_LINKS
      - ATTACH_FILES
      - ADD_REACTIONS
      - MENTION_EVERYONE   # pour pouvoir mentionner @Lycéen-vérifié dans son AMA
      - CONNECT
      - SPEAK
      - STREAM
      - USE_APPLICATION_COMMANDS

  # --- Staff lycée (profs accompagnants — optionnel) ---
  - id: staff_lycee
    name: "🏫 Staff lycée"
    color: "#1ABC9C"     # turquoise
    hoist: true
    mentionable: true
    permissions:
      - VIEW_CHANNEL
      - READ_MESSAGE_HISTORY
      - SEND_MESSAGES
      - EMBED_LINKS
      - ATTACH_FILES
      - ADD_REACTIONS
      - CONNECT
      - SPEAK
    note: "Lecture partout sauf #staff-* ; pas de modération."

  # --- Membre vérifié (acceptation des règles via réaction) ---
  - id: lyceen_verifie
    name: "🎓 Lycéen vérifié"
    color: "#2ECC71"     # vert
    hoist: true          # affiché dans la liste comme groupe
    mentionable: false   # pas de @Lycéen-vérifié, trop de bruit
    permissions:
      - VIEW_CHANNEL
      - READ_MESSAGE_HISTORY
      - SEND_MESSAGES
      - EMBED_LINKS
      - ATTACH_FILES
      - ADD_REACTIONS
      - USE_EXTERNAL_EMOJIS
      - CONNECT
      - SPEAK
      - STREAM
      - USE_APPLICATION_COMMANDS

  # --- Rôles d'intérêt (auto-attribués via réaction sur #choix-intérêts) ---
  # Servent à pinger sélectivement (ex: @🔐 Curieux cyber pour une annonce CTF).
  # Aucune permission spéciale, juste de l'identité. Pas hoist : pas affichés
  # comme groupes séparés dans la liste des membres.

  - id: interet_bidouilleur
    name: "🛠️ Bidouilleur confirmé"
    color: "#F39C12"     # orange
    hoist: false
    mentionable: true
    permissions: []
    note: "Auto-attribué via réaction, déclaratif. Pas de filtre."

  - id: interet_cyber
    name: "🔐 Curieux cyber"
    color: "#E74C3C"     # rouge tech
    hoist: false
    mentionable: true
    permissions: []

  - id: interet_ia
    name: "🤖 Curieux IA"
    color: "#9B59B6"     # violet
    hoist: false
    mentionable: true
    permissions: []

  - id: interet_dev
    name: "💻 Curieux dev"
    color: "#3498DB"     # bleu
    hoist: false
    mentionable: true
    permissions: []

# -----------------------------------------------------------------------------
# Catégories & salons
# -----------------------------------------------------------------------------
# Permissions héritées de la catégorie sauf override explicite sur le salon.
# Convention : @everyone = par défaut pas d'accès,
# on whiteliste explicitement les rôles qui peuvent voir.
# -----------------------------------------------------------------------------

categories:

  # === 0. ACCUEIL — visible par tous, écriture restreinte ====================
  - id: cat_accueil
    name: "🏠 Accueil"
    position: 0
    overwrites:
      - target: "@everyone"
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
        deny:  [SEND_MESSAGES, ADD_REACTIONS, CREATE_PUBLIC_THREADS]
    channels:

      - id: ch_regles
        name: "📜-règles"
        type: text
        topic: "Les règles du serveur. Lis-les en entier avant de réagir 👇"
        overwrites:
          - target: "@everyone"
            deny: [SEND_MESSAGES, ADD_REACTIONS]
            allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
          - target: administrateur
            allow: [SEND_MESSAGES, MANAGE_MESSAGES, ADD_REACTIONS]
        first_message: |
          # 📜 Règles du serveur

          Bienvenue ! Ce serveur est un espace de découverte autour de
          l'informatique, la cybersécurité, l'IA et les parcours d'études.

          **Pour rejoindre les discussions, réagis avec ✅ ci-dessous
          après avoir lu les règles.**

          ## Les règles

          1. **Respect.** Pas d'insultes, pas de discriminations,
             pas de harcèlement. Personne n'est ridicule de poser
             une question.
          2. **Sécurité.** Pas de partage de données perso (les tiennes
             ou celles des autres). Pas de doxxing.
          3. **Légalité.** Pas d'incitation à des actes illégaux —
             le hack se fait sur ses propres machines ou sur des
             plateformes faites pour (CTF, HTB, Root-Me, etc.).
          4. **Pas de NSFW.** Ce serveur accueille des mineurs.
          5. **Pas de pub/spam.** Pas de liens d'invitation Discord,
             pas de promo de services.
          6. **DMs entre membres :** déconseillés. Si un membre
             te met mal à l'aise en MP, signale-le aux modos.

          ## Modération

          - Les modos peuvent timeout, kick ou ban en cas d'écart.
          - En cas de problème : ping `@🛡️ Modérateur`.

          ## Ce que t'obtiens en validant

          Le rôle 🎓 **Lycéen vérifié** → accès à tout le serveur.

      - id: ch_bienvenue
        name: "👋-bienvenue"
        type: text
        topic: "Présente-toi ! Pseudo, ce qui t'intéresse, ton vibe tech."
        overwrites:
          # Lycéens vérifiés peuvent envoyer
          - target: lyceen_verifie
            allow: [SEND_MESSAGES, ADD_REACTIONS]
          - target: intervenant
            allow: [SEND_MESSAGES, ADD_REACTIONS]
          - target: staff_lycee
            allow: [SEND_MESSAGES, ADD_REACTIONS]
        slowmode_delay: 30   # 30s pour éviter le flood
        first_message: |
          # 👋 #bienvenue

          Présente-toi à la communauté ! En quelques lignes :

          - **Pseudo** ou prénom (comme tu veux).
          - **Ce qui t'intéresse** dans la tech (dev, cyber, IA, hardware, jeux…).
          - **Ton "vibe tech" du moment** : un projet, un truc qui te fascine, ou juste "je débarque, je regarde".

          **Slowmode** : 30 secondes entre deux messages (anti-flood, le temps que tout le monde soit lu).

          Bienvenue ici 🐺

      - id: ch_annonces
        name: "📢-annonces"
        type: announcement
        topic: "Annonces officielles. Pas d'écriture lycéens."
        overwrites:
          - target: "@everyone"
            deny: [SEND_MESSAGES, ADD_REACTIONS]
          - target: administrateur
            allow: [SEND_MESSAGES, MENTION_EVERYONE]
          - target: moderateur
            allow: [SEND_MESSAGES]
        first_message: |
          # 📢 #annonces

          Annonces officielles du serveur : événements, sessions live, AMA avec un·e intervenant·e, infos modération.

          **Qui peut poster** : seulement les Admins et Modos.
          **Lecture seule** pour les lycéens — tu peux réagir aux messages mais pas écrire.
          **Notifications** : active la cloche du salon pour ne rien rater.

          Si tu veux discuter d'une annonce, va dans #💬-général.

      - id: ch_choix_interets
        name: "🎯-choix-intérêts"
        type: text
        topic: "Réagis pour t'attribuer des centres d'intérêt et recevoir les pings ciblés."
        overwrites:
          - target: "@everyone"
            deny: [SEND_MESSAGES]
            allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, ADD_REACTIONS]
        first_message: |
          # 🎯 Tes centres d'intérêt

          Réagis avec l'emoji correspondant pour t'auto-attribuer le rôle.
          Tu peux en cumuler autant que tu veux. Re-clique pour retirer.

          - 💻 → **Curieux dev** (code, projets perso, web, mobile…)
          - 🤖 → **Curieux IA** (LLMs, ML, ce que ça change…)
          - 🔐 → **Curieux cyber** (sécurité, CTF, défense…)
          - 🛠️ → **Bidouilleur confirmé** (tu bidouilles déjà depuis un moment)

          Ces rôles servent juste à recevoir les pings qui t'intéressent.

  # === 1. DISCUSSIONS GÉNÉRALES ==============================================
  - id: cat_discussion
    name: "💬 Discussions"
    position: 1
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: intervenant
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES]
    channels:
      - id: ch_general
        name: "💬-général"
        type: text
        topic: "Chat général. Pas de sujet imposé."
        first_message: |
          # 💬 #général

          Salon de discussion libre, sans sujet imposé.

          **Règles** : celles du serveur (lis #📜-règles si pas déjà fait).
          **Slowmode** : désactivé.
          **Pour de l'aide ciblée** : préfère #❓-questions-débutants ou #🆘-aide-code.

          Sois sympa, lis avant de poster 🐺
      - id: ch_questions_debutants
        name: "❓-questions-débutants"
        type: text
        topic: "Aucune question n'est bête. Pour de vrai."
        slowmode_delay: 0
        first_message: |
          # ❓ #questions-débutants

          Pose tes questions ici. **Aucune question n'est bête**, pour de vrai.

          **Comment poser une bonne question** :
          - Décris ce que tu essaies de comprendre (pas juste "comment ça marche").
          - Mentionne ce que t'as déjà cherché ou essayé.
          - Si c'est du code, formate-le avec ``` ``` (bloc de code).

          **Slowmode** : désactivé.
          **Pas de jugement** : tout le monde a commencé quelque part.
      - id: ch_hors_sujet
        name: "🎲-hors-sujet"
        type: text
        topic: "Tout ce qui n'est pas tech. Restez corrects."
        slowmode_delay: 10
        first_message: |
          # 🎲 #hors-sujet

          Tout ce qui n'est pas tech : films, jeux, musique, vie de lycéen, mèmes…

          **Règles** : celles du serveur s'appliquent (respect, pas de NSFW, pas de discriminations).
          **Slowmode** : 10 secondes entre deux messages.
          **Pas politique ni religieux** : ces sujets dérapent vite, gardez-les pour ailleurs.

  # === 2. CYBER ===============================================================
  - id: cat_cyber
    name: "🔐 Cybersécurité"
    position: 2
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: intervenant
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
    channels:
      - id: ch_cyber_chat
        name: "🛡️-discussions"
        type: text
        topic: "Cybersécurité : actu, questions, débats."
        first_message: |
          # 🛡️ #cyber-discussions

          Tout ce qui touche à la cybersécurité : actu, débats, questions, retours d'expérience.

          **Sujets bienvenus** : techniques défensives, vulnérabilités publiques, métiers, parcours, RGPD, vie privée.
          **Sujets interdits** : demander/partager des accès à des systèmes qui ne t'appartiennent pas. Ici on apprend, on ne se sert pas.
          **Slowmode** : désactivé.
      - id: ch_ctf
        name: "🚩-ctf-et-challenges"
        type: text
        topic: "CTF, Root-Me, HTB. Partage writeups & équipes. Pas de spoiler !"
        first_message: |
          # 🚩 #ctf-et-challenges

          CTF (Capture The Flag), challenges Root-Me, HackTheBox, TryHackMe…

          **Partage** : writeups, équipes, liens de challenges, captures d'écran (pas de flags directs).
          **Spoiler tag** : utilise `||spoiler||` pour les solutions, surtout pour les CTF en cours.
          **Recrutement d'équipe** : OK — ping `@🔐 Curieux cyber` si tu cherches des coéquipiers.
          **Slowmode** : désactivé.
      - id: ch_veille_cyber
        name: "📰-veille"
        type: text
        topic: "Articles, news, vidéos. Évitez les hot takes."
        first_message: |
          # 📰 #cyber-veille

          Articles, news, vidéos, podcasts sur la cyber.

          **Format conseillé** : lien + 1-2 phrases de contexte ("pourquoi c'est intéressant").
          **Évite** : les hot takes ("OMG c'est la fin du monde"), le FUD, les threads twitter sans intérêt.
          **Slowmode** : désactivé.

  # === 3. IA =================================================================
  - id: cat_ia
    name: "🤖 IA & Données"
    position: 3
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: intervenant
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
    channels:
      - id: ch_ia_chat
        name: "💡-discussions"
        type: text
        topic: "IA : comment ça marche, ce que ça change, ce que ça change pas."
        first_message: |
          # 💡 #ia-discussions

          Discussions IA : comment ça marche, ce que ça change (ou pas), questions, débats.

          **Sujets bienvenus** : LLMs, ML classique, vision, audio, éthique, impact sur les études/métiers.
          **Évite** : la pub d'outils sans contexte, les "x va remplacer y" sans nuance.
          **Slowmode** : désactivé.
      - id: ch_ia_projets
        name: "🚀-vos-projets"
        type: text
        topic: "Projets IA, expériences, prompts intéressants."
        first_message: |
          # 🚀 #ia-vos-projets

          Partage tes projets IA, expériences, prompts marrants, idées.

          **Format conseillé** : un titre + description courte + capture/lien.
          **OK** : projets perso, expériences, prompts, configurations, jailbreaks pédagogiques.
          **Slowmode** : désactivé.

  # === 4. DEV ================================================================
  - id: cat_dev
    name: "💻 Code & Dev"
    position: 4
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: intervenant
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY]
    channels:
      - id: ch_dev_chat
        name: "⌨️-discussions"
        type: text
        topic: "Tout dev : web, mobile, jeux, scripts, choix de langage…"
        first_message: |
          # ⌨️ #dev-discussions

          Tout ce qui touche au dev : choix de langage, frameworks, métiers, parcours, débats.

          **Sujets bienvenus** : web, mobile, jeux, système, embarqué, scripting, outils.
          **Pour de l'aide sur du code spécifique** : préfère #🆘-aide-code.
          **Slowmode** : désactivé.
      - id: ch_dev_aide
        name: "🆘-aide-code"
        type: text
        topic: "Bloqué·e sur un truc ? Colle ton code (formaté !) et explique."
        first_message: |
          # 🆘 #aide-code

          Bloqué·e sur du code ? Demande ici.

          **Comment poser une question utile** :
          1. Décris ce que tu essaies de faire.
          2. Colle ton code dans un bloc ``` ``` (syntaxe colorée).
          3. Indique l'erreur exacte (message + ligne).
          4. Précise ce que t'as déjà essayé.

          **Slowmode** : désactivé.
          **Pas de DM à la communauté pour résoudre les bugs** : c'est ici que ça se passe — d'autres apprennent aussi.
      - id: ch_dev_projets
        name: "✨-vos-projets"
        type: text
        topic: "Vos créations. Repos GitHub, sites perso, idées en cours."
        first_message: |
          # ✨ #dev-vos-projets

          Tes créations : repos GitHub, sites perso, jeux, scripts, idées en cours.

          **Format conseillé** : titre + 2-3 lignes de description + lien (GitHub, démo, capture).
          **Feedback** : encourage avec ✨, et donne du retour utile si t'en demandes.
          **Slowmode** : désactivé.

  # === 5. PARCOURS & ORIENTATION =============================================
  - id: cat_parcours
    name: "🎓 Parcours & Orientation"
    position: 5
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: intervenant
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
    channels:
      - id: ch_parcours
        name: "🎓-études-post-bac"
        type: text
        topic: "BTS, BUT, école, fac, alternance, autodidacte… vos questions."
        first_message: |
          # 🎓 #études-post-bac

          BTS, BUT, écoles d'ingé, fac, alternance, autodidacte… questions sur l'après-bac.

          **Sujets bienvenus** : ce qui se fait, ce que ça coûte, ce que ça vaut, témoignages.
          **Anonymat** : si tu préfères pas dire ton lycée ou ta classe, OK — décris juste ta situation.
          **Slowmode** : désactivé.
      - id: ch_metiers
        name: "💼-métiers"
        type: text
        topic: "Questions métiers. Les intervenants répondent ici."
        first_message: |
          # 💼 #métiers

          Questions sur les métiers de la tech. Les intervenants pro répondent ici.

          **Format conseillé** : une question précise par message ("dev backend, c'est quoi le quotidien ?").
          **Évite** : "c'est bien payé ?" sans contexte — précise le métier.
          **Slowmode** : désactivé.
          **Si t'es intervenant·e** : merci de prendre le temps de répondre 🎤
      - id: ch_ressources
        name: "📚-ressources"
        type: text
        topic: "Livres, plateformes, comptes à suivre. Lecture seule."
        overwrites:
          - target: lyceen_verifie
            deny: [SEND_MESSAGES]
            allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, ADD_REACTIONS]
          - target: administrateur
            allow: [SEND_MESSAGES, MANAGE_MESSAGES]
          - target: moderateur
            allow: [SEND_MESSAGES]
        first_message: |
          # 📚 #ressources

          Livres, plateformes de cours, comptes/chaînes à suivre, outils.

          **Qui peut poster** : seulement les Admins/Modos (pour garantir la qualité et éviter le bruit).
          **Suggérer une ressource** : ping un Modo dans #💬-général, on l'ajoute si elle tient la route.
          **Lecture seule** pour tout le monde — tu peux réagir aux messages pour up les ressources que tu kiffes.

  # === 6. VOCAL ==============================================================
  - id: cat_vocal
    name: "🔊 Vocal"
    position: 6
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: lyceen_verifie
        allow: [VIEW_CHANNEL, CONNECT, SPEAK, STREAM, USE_VAD]
      - target: intervenant
        allow: [VIEW_CHANNEL, CONNECT, SPEAK, STREAM, USE_VAD]
      - target: staff_lycee
        allow: [VIEW_CHANNEL, CONNECT, SPEAK]
    channels:
      - id: ch_voc_chill
        name: "🛋️ Chill"
        type: voice
        user_limit: 0
      - id: ch_voc_etude
        name: "📚 Étude en groupe"
        type: voice
        user_limit: 0
      - id: ch_voc_intervention
        name: "🎤 Salon intervention"
        type: voice
        user_limit: 50
        note: "Réservé aux moments où un intervenant parle à plusieurs."

  # === 7. SESSION LIVE (privé, flux webhooks temps réel) =====================
  # Catégorie dédiée aux flux entrants pendant l'intervention.
  # Webhooks externes (site /questions, n8n, etc.) postent ici.
  # Intentionnellement séparée de "Staff" pour pouvoir tout couper/archiver
  # facilement entre deux sessions.
  - id: cat_session_live
    name: "🔴 Session live"
    position: 7
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: moderateur
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS]
      - target: administrateur
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, ADD_REACTIONS, MANAGE_WEBHOOKS]
      # Note: pour ajouter les intervenants à une session live, leur donner
      # accès manuellement OU créer un rôle "Intervenant-session-N" temporaire.
    channels:
      - id: ch_questions_live
        name: "❓-questions-live"
        type: text
        topic: "Questions anonymes du site /questions. Push webhook auto."
        # Salon où le webhook du form /questions posera chaque nouvelle
        # question soumise par les lycéens. Tu peux ping `@here` depuis le
        # payload n8n/backend si tu veux une notif sonore.

      # Décommente / ajoute si tu redirigerais aussi votes & quiz sur Discord :
      # - id: ch_votes_live
      #   name: "🗳️-votes-live"
      #   type: text
      #   topic: "Updates de vote en temps réel depuis n8n."
      #
      # - id: ch_quiz_live
      #   name: "📊-quiz-scores-live"
      #   type: text
      #   topic: "Scores quiz agrégés. Push depuis l'API."

  # === 8. STAFF (privé) ======================================================
  - id: cat_staff
    name: "🔧 Staff"
    position: 8
    overwrites:
      - target: "@everyone"
        deny: [VIEW_CHANNEL]
      - target: moderateur
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, CONNECT, SPEAK]
      - target: administrateur
        allow: [VIEW_CHANNEL, READ_MESSAGE_HISTORY, SEND_MESSAGES, CONNECT, SPEAK]
    channels:
      - id: ch_staff_chat
        name: "🔧-staff-chat"
        type: text
        topic: "Discussions modération."
        first_message: |
          # 🔧 #staff-chat

          Coordination modération — privé Admins/Modos.

          **À utiliser pour** : décisions de modération, observations sur des membres, sujets sensibles, planification de sessions.
          **Pas pour** : le hors-sujet (allez dans #🎲-hors-sujet pour ça).
          **Slowmode** : désactivé.
      - id: ch_staff_signalements
        name: "🚨-signalements"
        type: text
        topic: "Bot pousse ici les signalements et alertes auto."
      - id: ch_staff_logs
        name: "📊-logs-bot"
        type: text
        topic: "Logs automatiques (join/leave/timeout/edits)."
      - id: ch_staff_voc
        name: "🔊 Staff vocal"
        type: voice

# -----------------------------------------------------------------------------
# Webhooks
# -----------------------------------------------------------------------------
# Le bot crée les webhooks au moment de l'apply. Les URLs sont des SECRETS :
# le bot les envoie en DM à l'admin qui a lancé la commande — jamais en clair
# dans un salon. À stocker ensuite dans Infisical (ou équivalent) et à
# référencer depuis n8n / le backend du site.
#
# Idempotence : matching par (channel + name). Si un webhook avec ce nom
# existe déjà dans le bon salon, ne pas recréer ; juste rappeler son URL
# en DM si demandé via `/server-config webhooks reveal`.
# -----------------------------------------------------------------------------

webhooks:
  - id: wh_questions_live
    channel: ch_questions_live
    name: "📥 Questions du site"
    avatar_url: null   # optionnel, sinon utilise l'avatar du bot
    description: >
      Reçoit les questions anonymes soumises via /questions sur le site
      d'intervention. Consommé par n8n ou directement par le backend FastAPI.

  # Décommente / ajoute selon ce que tu veux pousser dans Discord :
  # - id: wh_votes_live
  #   channel: ch_votes_live
  #   name: "🗳️ Votes"
  #   description: "Updates de vote en temps réel depuis n8n."
  #
  # - id: wh_quiz_scores
  #   channel: ch_quiz_live
  #   name: "📊 Quiz scores"
  #   description: "Scores agrégés du quiz."

# -----------------------------------------------------------------------------
# Réactions auto-rôles
# -----------------------------------------------------------------------------
# Le bot doit poser ces réactions sur les messages indiqués et les écouter
# pour attribuer/retirer le rôle correspondant.
# -----------------------------------------------------------------------------

reaction_roles:
  - channel: ch_regles
    message_marker: "first_message"   # le message créé par le bot ci-dessus
    bindings:
      - emoji: "✅"
        role: lyceen_verifie
        mode: add_only   # ne retire pas si on dé-réagit (sinon on perdrait l'accès)

  - channel: ch_choix_interets
    message_marker: "first_message"
    bindings:
      - emoji: "💻"
        role: interet_dev
        mode: toggle
      - emoji: "🤖"
        role: interet_ia
        mode: toggle
      - emoji: "🔐"
        role: interet_cyber
        mode: toggle
      - emoji: "🛠️"
        role: interet_bidouilleur
        mode: toggle

